[package]
name = "benchmark-cluster"
version = "0.1.0"
edition = "2021"
description = "Arcane cluster binary with benchmark simulation. Implements ClusterSimulation with kinematic physics matching SpacetimeDB's physics_tick."
license = "AGPL-3.0-only"

[[bin]]
name = "benchmark-cluster"
path = "src/main.rs"

[dependencies]
arcane-core = { path = "../../arcane/crates/arcane-core" }
arcane-infra = { path = "../../arcane/crates/arcane-infra", features = ["cluster-ws", "spacetimedb-persist"] }
uuid = { version = "1.0", features = ["v4"] }
serde_json = "1.0"
