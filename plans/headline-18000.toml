# Extended headline benchmark: 1,500 → 18,000 CCU @ 60 Hz / 1 KB.
# Same structure as headline-13500 but continues beyond to find the ceiling.
# Controller stops on first gate failure and reports last passing tier.

[plan]
name = "headline-18000"
description = "18,000 CCU ceiling test @ 60 Hz / 1 KB user_data / 12 drivers"
tick_rate_hz = 60

[[phases]]
name = "tier-1500-aggregate"
target_players = 1500
spawn_delay_ms = 25
hold_seconds = 30
[phases.gate]
max_p99_latency_ms = 50
max_error_rate = 0.05
min_sample_rate = 0.02
max_mean_latency_ms = 50.0

