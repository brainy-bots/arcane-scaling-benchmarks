# Ceiling hunt: extend past the 13,500 headline to find the actual limit.
#
# Starts at 13,500 (proven baseline), then increments by 500 up to 16,000.
# 30 s hold per tier. Gate at 50 ms (same as headline plan — server tick
# budget). Since drivers are co-located in the same VPC, the gate measures
# pure server-side processing time; real clients add network RTT on top.

[plan]
name = "ceiling-16000"
description = "Ceiling hunt: 13,500 → 16,000 in 500-step increments, 50 ms gate"

[[phases]]
name = "tier-13500-baseline"
target_players = 13500
spawn_delay_ms = 25
hold_seconds = 30
[phases.gate]
max_p99_latency_ms = 50

[[phases]]
name = "tier-14000"
target_players = 14000
spawn_delay_ms = 25
hold_seconds = 30
[phases.gate]
max_p99_latency_ms = 50

