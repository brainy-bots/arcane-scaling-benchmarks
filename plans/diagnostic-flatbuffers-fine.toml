# Diagnostic: fine-grained latency curve for FlatBuffers wire format.
#
# 250-step increments from 500 → 5,000 CCU to characterize the
# latency scaling shape precisely. 20s hold per tier (shorter than
# headline's 30s — enough for steady-state, faster iteration).
# Same 60 Hz / 50 ms gate as headline.

[plan]
name = "diagnostic-flatbuffers-fine"
description = "Fine-grained FlatBuffers latency curve: 500 → 5,000 in 250-step increments @ 60 Hz"
tick_rate_hz = 60

[[phases]]
name = "tier-500"
target_players = 500
spawn_delay_ms = 25
hold_seconds = 20
[phases.gate]
max_p99_latency_ms = 50
max_error_rate = 0.05
min_sample_rate = 0.02
max_mean_latency_ms = 50.0

